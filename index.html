<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#26203b"><title>Purrsuit</title>
<style>
:root{--ink:#fff;--panel:#28213d;--accent:#ffca55;--pink:#ff6f9e;--muted:#d4cbe8}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}body{margin:0;min-height:100svh;background:#171322;color:var(--ink);font-family:ui-rounded,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow:hidden}#app{height:100svh;max-width:720px;margin:auto;display:flex;flex-direction:column;gap:12px;padding:max(14px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom))}header{display:flex;align-items:center;justify-content:space-between}h1{font-size:1.55rem;margin:0}h1 span{color:var(--accent)}.score{font-weight:900;background:#38304e;border-radius:16px;padding:8px 12px}.modebar{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}button{font:inherit;border:0;color:inherit;cursor:pointer;touch-action:manipulation}.mode{padding:9px 3px;min-height:45px;border-radius:13px;background:#302942;color:var(--muted);font-weight:800;font-size:.76rem}.mode.active{background:var(--accent);color:#241c31}#game{position:relative;flex:1;min-height:310px;overflow:hidden;border-radius:25px;background:#d9d1be;box-shadow:inset 0 0 0 2px rgba(255,255,255,.35),0 13px 30px rgba(0,0,0,.3);touch-action:manipulation}.animal{position:absolute;z-index:2;width:88px;height:72px;padding:0;background:none;filter:drop-shadow(0 4px 3px rgba(0,0,0,.25));will-change:left,top,transform}.animal svg{width:100%;height:100%;overflow:visible}.burst{position:absolute;z-index:4;pointer-events:none;font-size:1.7rem;font-weight:900;animation:pop .55s ease-out forwards;text-shadow:0 2px 2px rgba(0,0,0,.2)}@keyframes pop{0%{opacity:0;transform:translate(-50%,-50%) scale(.5)}25%{opacity:1;transform:translate(-50%,-75%) scale(1.1)}100%{opacity:0;transform:translate(-50%,-130%) scale(.8)}}.controls{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;background:#28213d;border-radius:16px;padding:9px 12px}.speedlabel{font-size:.9rem;font-weight:800;color:var(--muted);display:flex;gap:9px;align-items:center}.speedlabel output{color:var(--accent);min-width:40px}input[type=range]{accent-color:var(--accent);width:min(38vw,190px)}.bottom{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}#status{font-size:.9rem;color:var(--muted);line-height:1.25}#start{min-height:52px;padding:0 19px;border-radius:16px;background:var(--pink);font-weight:900}.hint{position:absolute;inset:0;z-index:3;display:grid;place-items:center;padding:25px;text-align:center;pointer-events:none;transition:opacity .2s}.hint.hide{opacity:0}.hint div{max-width:290px;padding:18px;background:rgba(38,32,59,.88);border-radius:18px;box-shadow:0 6px 20px rgba(0,0,0,.25)}.hint strong{display:block;color:var(--accent);font-size:1.18rem;margin-bottom:5px}@media(min-width:700px){#game{min-height:490px}}
</style>
</head>
<body><main id="app"><header><h1>🐾 <span>Purr</span>suit</h1><div class="score">Score <span id="points">0</span></div></header><nav class="modebar"><button class="mode active" data-mode="mouse">🐭 Mice</button><button class="mode" data-mode="bug">🐞 Bugs</button><button class="mode" data-mode="mixed">✨ Mixed</button></nav><section id="game" aria-label="Tap the scurrying animal"><div class="hint" id="hint"><div><strong>Tap the scurrying critter!</strong>Use the speed control below to set a pace your cat enjoys.</div></div></section><div class="controls"><label class="speedlabel" for="speed">Speed <output id="speedvalue">Normal</output></label><input id="speed" type="range" min="1" max="5" value="3" aria-label="Animal speed"></div><div class="bottom"><div id="status">Choose a mode and press Start.</div><button id="start">Start game</button></div></main>
<script>
const game=document.querySelector('#game'), points=document.querySelector('#points'), start=document.querySelector('#start'), status=document.querySelector('#status'), hint=document.querySelector('#hint'), speed=document.querySelector('#speed'), speedValue=document.querySelector('#speedvalue');
const drawings={mouse:`<svg viewBox="0 0 120 85" aria-hidden="true"><path fill="#8b7168" d="M15 47 C3 37 4 20 18 21 C28 22 28 36 27 41 C35 26 53 20 72 25 C97 31 107 46 102 60 C98 73 71 77 47 68 C30 62 21 55 15 47Z"/><circle fill="#b7978c" cx="34" cy="27" r="14"/><circle fill="#d9b7ab" cx="34" cy="27" r="8"/><circle fill="#1e1722" cx="83" cy="42" r="3.3"/><circle fill="#f1a6a2" cx="104" cy="51" r="4"/><path d="M15 50 C-5 55 -7 75 8 79 C21 83 27 73 19 66" fill="none" stroke="#be8ca0" stroke-width="4" stroke-linecap="round"/><path d="M54 68 l-3 9 M75 70 l2 8" stroke="#5d4c49" stroke-width="4" stroke-linecap="round"/></svg>`,bug:`<svg viewBox="0 0 120 85" aria-hidden="true"><g stroke="#2f2732" stroke-width="4" stroke-linecap="round" fill="none"><path d="M48 43 L27 28 M47 49 L22 52 M50 55 L29 71 M76 43 L97 28 M77 49 L103 52 M75 55 L96 71"/></g><ellipse fill="#df3f45" cx="62" cy="48" rx="26" ry="23"/><path fill="#20212b" d="M62 25 C55 28 51 37 51 48 C51 60 56 69 62 71Z"/><circle fill="#24242b" cx="62" cy="22" r="11"/><path d="M55 14 L48 6 M69 14 L76 6" stroke="#25232b" stroke-width="3" stroke-linecap="round"/><g fill="#24242b"><circle cx="76" cy="39" r="4"/><circle cx="78" cy="55" r="4"/><circle cx="48" cy="42" r="4"/><circle cx="47" cy="57" r="4"/></g></svg>`,beetle:`<svg viewBox="0 0 120 85" aria-hidden="true"><g stroke="#332635" stroke-width="4" stroke-linecap="round" fill="none"><path d="M45 42 L24 29 M45 49 L19 50 M47 57 L27 71 M75 42 L96 29 M76 49 L102 50 M74 57 L94 71"/></g><ellipse fill="#3d9b78" cx="61" cy="48" rx="25" ry="25"/><path d="M61 24V72" stroke="#1e5845" stroke-width="3"/><ellipse fill="#243538" cx="61" cy="21" rx="11" ry="10"/><path d="M55 14 L48 5 M67 14 L75 5" stroke="#27313a" stroke-width="3" stroke-linecap="round"/></svg>`};
let mode='mouse',running=false,score=0,current=null,last=0,x=0,y=0,vx=0,vy=0,nextJitter=0;
const choices=()=>mode==='mouse'?['mouse']:mode==='bug'?['bug','beetle']:['mouse','bug','beetle'];
function setMode(m){mode=m;document.querySelectorAll('.mode').forEach(b=>b.classList.toggle('active',b.dataset.mode===m));status.textContent=`${m==='mixed'?'Mixed critters':m==='mouse'?'Scurrying mice':'Scurrying bugs'} ready.`;if(running)spawn()}
document.querySelectorAll('.mode').forEach(b=>b.onclick=()=>setMode(b.dataset.mode));
speed.oninput=()=>{const labels=['Very slow','Slow','Normal','Fast','Very fast'];speedValue.value=labels[speed.value-1]};
function spawn(){if(current)current.remove();current=document.createElement('button');current.className='animal';current.setAttribute('aria-label','Tap animal');current.innerHTML=drawings[choices()[Math.floor(Math.random()*choices().length)]];game.appendChild(current);const r=game.getBoundingClientRect(),fromLeft=Math.random()>.5;x=fromLeft?-85:r.width+8;y=24+Math.random()*(r.height-100);const base=38+Number(speed.value)*31;vx=(fromLeft?1:-1)*(base+Math.random()*45);vy=(Math.random()-.5)*base*.38;nextJitter=0;current.onclick=catchIt}
function catchIt(e){e.preventDefault();if(!running)return;score++;points.textContent=score;const pop=document.createElement('span');pop.className='burst';pop.textContent=score%10===0?'PURR!':'+1';pop.style.left=(x+40)+'px';pop.style.top=(y+20)+'px';game.appendChild(pop);setTimeout(()=>pop.remove(),600);if(navigator.vibrate)navigator.vibrate(15);spawn()}
function loop(t){if(running&&current){const dt=Math.min(.045,(t-last)/1000),r=game.getBoundingClientRect(),pace=Number(speed.value);if(t>nextJitter){vy+=(Math.random()-.5)*(45+pace*32);vx+=(Math.random()-.5)*(18+pace*12);const cap=80+pace*55;vx=Math.sign(vx||1)*Math.min(Math.abs(vx),cap);vy=Math.max(-cap*.65,Math.min(cap*.65,vy));nextJitter=t+110+Math.random()*260}x+=vx*dt;y+=vy*dt;if(y<10||y>r.height-75)vy*=-1;if(x<-95||x>r.width+15)spawn();current.style.left=x+'px';current.style.top=y+'px';current.style.transform=`scaleX(${vx<0?-1:1}) rotate(${Math.max(-10,Math.min(10,vy*.06))}deg)`}last=t;requestAnimationFrame(loop)}
start.onclick=()=>{running=!running;start.textContent=running?'Pause':'Resume';hint.classList.add('hide');if(running){status.textContent='Tap it before it scurries away!';spawn()}else status.textContent='Paused.'};requestAnimationFrame(loop);
</script></body></html>

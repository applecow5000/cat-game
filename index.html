<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#15112a" />
  <title>Purrsuit — Cat Tap Game</title>
  <style>
    :root { --ink:#fff9ff; --muted:#c9c1df; --panel:#241d40; --accent:#ffbf4f; --pink:#ff6c9a; --mint:#78ead4; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select:none; }
    body { margin:0; min-height:100svh; color:var(--ink); font-family:ui-rounded, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background:radial-gradient(circle at 15% 0%, #544581, transparent 34%), linear-gradient(160deg,#171126,#0a0c19); overflow:hidden; }
    #app { height:100svh; max-width:720px; margin:auto; display:flex; flex-direction:column; padding:max(14px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom)); gap:12px; }
    header { display:flex; align-items:center; justify-content:space-between; gap:12px; }
    h1 { font-size:clamp(1.25rem,5vw,1.75rem); margin:0; letter-spacing:.02em; }
    h1 span { color:var(--accent); }
    .score { background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.16); border-radius:18px; padding:8px 12px; font-weight:800; white-space:nowrap; }
    .modebar { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
    button { font:inherit; color:var(--ink); border:0; cursor:pointer; touch-action:manipulation; }
    .mode { min-height:47px; padding:7px 4px; border-radius:14px; background:rgba(255,255,255,.09); color:var(--muted); font-size:.77rem; font-weight:800; transition:.18s; }
    .mode.active { color:#19132b; background:var(--accent); box-shadow:0 5px 18px rgba(255,191,79,.26); }
    #game { position:relative; flex:1; min-height:300px; overflow:hidden; border-radius:28px; background:linear-gradient(#5eb7e8 0 55%, #87cb69 55% 100%); box-shadow:inset 0 0 0 2px rgba(255,255,255,.2), 0 14px 36px rgba(0,0,0,.3); touch-action:manipulation; }
    #game.night { background:radial-gradient(circle at 78% 18%, #fff4b0 0 5%, transparent 5.5%), linear-gradient(#28245d 0 55%, #34503d 55% 100%); }
    #game.snow { background:linear-gradient(#b6dff0 0 55%, #eafaff 55% 100%); }
    .cloud { position:absolute; width:85px; height:28px; opacity:.68; background:#fff; border-radius:30px; top:12%; animation:drift 15s linear infinite; pointer-events:none; }
    .cloud::before,.cloud::after { content:""; position:absolute; background:inherit; border-radius:50%; }.cloud::before { width:35px;height:35px; left:12px;bottom:0 }.cloud::after { width:42px;height:42px; left:36px;bottom:0 }.cloud.two { top:27%; transform:scale(.58); animation-duration:22s; animation-delay:-8s; }
    @keyframes drift { from {left:-115px} to {left:105%} }
    .animal { position:absolute; z-index:3; display:grid; place-items:center; width:68px; height:68px; border-radius:50%; font-size:44px; filter:drop-shadow(0 4px 2px rgba(0,0,0,.22)); transition:transform .1s; will-change:transform,left,top; cursor:pointer; }
    .animal:active { transform:scale(.72) rotate(8deg)!important; }
    .burst { position:absolute; z-index:8; pointer-events:none; color:#fff; font-size:1.8rem; font-weight:900; animation:pop .58s ease-out forwards; text-shadow:0 2px 3px rgba(0,0,0,.22); }
    @keyframes pop { 0%{transform:translate(-50%,-50%) scale(.5);opacity:0} 30%{opacity:1;transform:translate(-50%,-78%) scale(1.1)} 100%{opacity:0;transform:translate(-50%,-135%) scale(.8)} }
    .bottom { display:grid; grid-template-columns:1fr auto; gap:10px; align-items:center; }
    #status { color:var(--muted); font-size:.9rem; line-height:1.25; min-height:32px; display:flex; align-items:center; }
    #start { border-radius:16px; min-height:52px; padding:0 18px; background:var(--pink); font-weight:900; box-shadow:0 6px 18px rgba(255,108,154,.25); }
    .howto { position:absolute; inset:0; z-index:10; display:grid; place-items:center; padding:24px; background:rgba(12,9,29,.26); text-align:center; pointer-events:none; transition:opacity .25s; }
    .howto.hide { opacity:0; }.howto div { max-width:300px; padding:20px; background:rgba(25,17,48,.76); border:1px solid rgba(255,255,255,.2); border-radius:20px; backdrop-filter:blur(8px); }.howto strong { color:var(--accent); font-size:1.2rem; display:block; margin-bottom:7px; }
    #game.frenzy .animal { filter:drop-shadow(0 0 8px #fff178) drop-shadow(0 4px 2px rgba(0,0,0,.22)); }
    @media (min-width:700px) { #app { padding-top:22px; } #game { min-height:490px; } }
  </style>
</head>
<body>
  <main id="app">
    <header><h1>🐾 <span>Purr</span>suit</h1><div class="score">Score <span id="points">0</span></div></header>
    <nav class="modebar" aria-label="Game modes">
      <button class="mode active" data-mode="garden">🌿 Garden Hunt</button>
      <button class="mode" data-mode="night">🌙 Night Chase</button>
      <button class="mode" data-mode="snow">❄️ Snow Pounce</button>
    </nav>
    <section id="game" aria-label="Tap the moving animals">
      <div class="cloud"></div><div class="cloud two"></div>
      <div class="howto" id="howto"><div><strong>Tap the critters!</strong>They scamper across the screen. Every tap earns a point and brings a new animal out. Perfect for curious paws. 🐱</div></div>
    </section>
    <div class="bottom"><div id="status">Choose a mode, then press Start.</div><button id="start">Start game</button></div>
  </main>
  <script>
    const game = document.querySelector('#game'), pointsEl = document.querySelector('#points'), status = document.querySelector('#status'), start = document.querySelector('#start'), howto = document.querySelector('#howto');
    const modes = {
      garden:{ animals:['🐭','🐦','🦋','🐞','🦎','🐿️'], label:'Garden Hunt', speed:1 },
      night:{ animals:['🦇','🪲','🦗','🐁','🦉','✨'], label:'Night Chase', speed:1.25 },
      snow:{ animals:['🐇','🐁','🐦','🦋','❄️','🐾'], label:'Snow Pounce', speed:.86 }
    };
    let mode='garden', score=0, running=false, current=null, raf=null, last=0, x=0,y=0,dx=0,dy=0;
    const choose = a => a[Math.floor(Math.random()*a.length)];
    function setMode(next) {
      mode=next; game.className=next==='garden'?'':next;
      document.querySelectorAll('.mode').forEach(b=>b.classList.toggle('active',b.dataset.mode===mode));
      status.textContent=`${modes[mode].label}: tap the moving critters!`;
      if (running) spawn();
    }
    document.querySelectorAll('.mode').forEach(b=>b.addEventListener('click',()=>setMode(b.dataset.mode)));
    function spawn() {
      if(current) current.remove();
      current=document.createElement('button'); current.className='animal'; current.setAttribute('aria-label','Moving animal');
      current.textContent=choose(modes[mode].animals); game.appendChild(current);
      const r=game.getBoundingClientRect(), fromLeft=Math.random()>.5;
      x=fromLeft?-58:r.width+3; y=44+Math.random()*(r.height-125);
      dx=(fromLeft?1:-1)*(65+Math.random()*100)*modes[mode].speed; dy=(Math.random()-.5)*48;
      current.style.left=x+'px'; current.style.top=y+'px';
      current.onclick=catchAnimal;
    }
    function catchAnimal(e) {
      e.preventDefault(); if(!running) return;
      score++; pointsEl.textContent=score;
      const r=game.getBoundingClientRect(), burst=document.createElement('span'); burst.className='burst'; burst.textContent=score%10===0?'MEOW!':'+'+1;
      burst.style.left=(x+32)+'px'; burst.style.top=(y+18)+'px'; game.appendChild(burst); setTimeout(()=>burst.remove(),650);
      if(navigator.vibrate) navigator.vibrate(18);
      if(score%10===0) { game.classList.add('frenzy'); status.textContent='Frenzy! Fast paws, fast points!'; setTimeout(()=>game.classList.remove('frenzy'),2200); }
      spawn();
    }
    function animate(t) {
      if(running && current) {
        const dt=Math.min((t-last)/1000,.05), r=game.getBoundingClientRect();
        x+=dx*dt; y+=dy*dt;
        if(y<20||y>r.height-83) dy*=-1;
        if(x<-75||x>r.width+15) spawn();
        current.style.left=x+'px'; current.style.top=y+'px';
        current.style.transform=`scaleX(${dx<0?-1:1}) rotate(${Math.sin(t/150)*7}deg)`;
      } last=t; raf=requestAnimationFrame(animate);
    }
    start.addEventListener('click',()=>{
      running=!running; start.textContent=running?'Pause':'Resume';
      howto.classList.add('hide');
      if(running) { status.textContent=`${modes[mode].label}: catch as many as you can!`; spawn(); }
      else status.textContent='Game paused. Your cat can resume anytime.';
    });
    requestAnimationFrame(animate);
  </script>
</body>
</html>
